name: Set up Flutter Android
description: Install the shared Flutter and Java toolchain and resolve dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.1'
        channel: stable
        cache: true
    - shell: bash
      run: flutter pub get --enforce-lockfile

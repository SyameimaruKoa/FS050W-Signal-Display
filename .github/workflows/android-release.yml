name: Android Release

on:
    push:
        tags: ['v*']

permissions:
    contents: read

concurrency:
    group: android-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        outputs:
            tag: ${{ steps.version.outputs.tag }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Validate release version
                id: version
                shell: bash
                env:
                    TAG: ${{ github.ref_name }}
                run: |
                    if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo 'Release tags must use vX.Y.Z.' >&2
                        exit 1
                    fi
                    echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                    echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
            -   uses: ./.github/actions/setup-flutter
            -   name: Run tests
                run: flutter test
            -   name: Restore release keystore
                shell: bash
                env:
                    KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                    STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                run: |
                    for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
                        if [[ -z "${!name}" ]]; then
                            echo "Missing signing secret: $name" >&2
                            exit 1
                        fi
                    done
                    umask 077
                    printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            -   name: Build signed release APKs
                env:
                    ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
                    ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                    ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                    ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                    VERSION_NAME: ${{ steps.version.outputs.name }}
                # Existing manually published builds use versionCode values below 1000.
                run: flutter build apk --release --split-per-abi --build-name="$VERSION_NAME" --build-number="$((1000 + ${{ github.run_number }}))"
            -   name: Remove release keystore
                if: always()
                run: rm -f "$RUNNER_TEMP/release.jks"
            -   name: Add checksums
                working-directory: build/app/outputs/flutter-apk
                run: sha256sum *-release.apk > SHA256SUMS.txt
            -   uses: actions/upload-artifact@v4
                with:
                    name: signed-android-release
                    path: |
                        build/app/outputs/flutter-apk/*-release.apk
                        build/app/outputs/flutter-apk/SHA256SUMS.txt
                    if-no-files-found: error
                    retention-days: 14

    publish:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            -   uses: actions/download-artifact@v4
                with:
                    name: signed-android-release
                    path: dist
            -   name: Create release or update assets
                shell: bash
                env:
                    GH_TOKEN: ${{ github.token }}
                    GH_REPO: ${{ github.repository }}
                    TAG: ${{ needs.build.outputs.tag }}
                run: |
                    if gh release view "$TAG" > /dev/null 2>&1; then
                        gh release upload "$TAG" dist/* --clobber
                    else
                        gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
                    fi

name: Draft Release (manual)

on:
    workflow_dispatch:
        inputs:
            ci_run_id:
                description: 'Android CI run id that produced the release artifact'
                required: true
                type: string
            head_sha:
                description: 'Commit SHA used in the artifact name'
                required: true
                type: string
            tag:
                description: 'Draft release tag'
                required: true
                default: 'v3.0.0-draft'
                type: string

permissions:
    actions: read
    contents: write

jobs:
    draft:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '17'
            -   uses: actions/download-artifact@v4
                with:
                    name: android-release-preview-${{ inputs.head_sha }}
                    run-id: ${{ inputs.ci_run_id }}
                    github-token: ${{ github.token }}
                    path: incoming
            -   name: Sign APK with the existing key and verify
                shell: bash
                env:
                    KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
                run: |
                    [[ -n "$KEYSTORE_BASE64" ]] || { echo 'Missing signing secret' >&2; exit 1; }
                    umask 077
                    printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
                    apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
                    [[ -x "$apksigner" ]] || { echo 'apksigner unavailable' >&2; exit 1; }
                    mkdir -p dist
                    apk="app-release.apk"
                    [[ -f "incoming/$apk" ]] || { echo "Missing $apk" >&2; exit 1; }
                    "$apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "dist/$apk" "incoming/$apk"
                    "$apksigner" verify "dist/$apk"
                    digest=$("$apksigner" verify --print-certs "dist/$apk" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1 | tr -d '[:space:]')
                    expected='ff3316eeda4e3474d86541581cd3deb662e038da1a0ade85a14a5883fc8b3268'
                    [[ "$digest" == "$expected" ]] || { echo "Unexpected signer: $digest" >&2; exit 1; }
                    cd dist
                    sha256sum *.apk > SHA256SUMS.txt
            -   name: Remove keystore
                if: always()
                shell: bash
                run: rm -f "$RUNNER_TEMP/release.keystore"
            -   name: Create draft release
                shell: bash
                env:
                    GH_TOKEN: ${{ github.token }}
                    GH_REPO: ${{ github.repository }}
                    TAG: ${{ inputs.tag }}
                    HEAD_SHA: ${{ inputs.head_sha }}
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.ci_run_id }}
                run: |
                    cat > "$RUNNER_TEMP/notes.md" <<EOF
                    ## FS050W Signal Display v3.0.0 — Native migration draft

                    Kotlin / Jetpack Compose rewrite with Material 3 / Material You.

                    - Flutter/Dart removed; full native Kotlin implementation
                    - Dynamic colour, OLED theme, Compose overlay/PiP
                    - minSdk 33 / targetSdk 36; release APK ~3 MB

                    **Draft — do not publish before device testing.**

                    Commit: $HEAD_SHA
                    CI: $RUN_URL
                    EOF
                    if gh release view "$TAG" > /dev/null 2>&1; then
                        gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
                        gh release edit "$TAG" --draft --notes-file "$RUNNER_TEMP/notes.md"
                    else
                        gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --draft --prerelease --title "$TAG (draft)" --notes-file "$RUNNER_TEMP/notes.md" --target "$HEAD_SHA"
                    fi

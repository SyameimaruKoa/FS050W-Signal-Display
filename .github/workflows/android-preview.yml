name: Android Preview Release

on:
    workflow_run:
        workflows: ['Android CI']
        types: [completed]

permissions:
    actions: read
    contents: read

jobs:
    publish:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read
            contents: write
        steps:
            # Do not check out or execute PR code in this privileged workflow.
            -   uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '17'
            -   uses: actions/download-artifact@v4
                with:
                    name: android-release-preview-${{ github.event.workflow_run.head_sha }}
                    run-id: ${{ github.event.workflow_run.id }}
                    github-token: ${{ github.token }}
                    path: incoming
            -   name: Sign preview APKs with the existing key
                shell: bash
                env:
                    KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
                run: |
                    [[ -n "$KEYSTORE_BASE64" ]] || { echo 'Missing signing secret: ANDROID_DEBUG_KEYSTORE_BASE64' >&2; exit 1; }
                    umask 077
                    printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/preview.keystore"
                    apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
                    [[ -x "$apksigner" ]] || { echo 'Android apksigner is unavailable.' >&2; exit 1; }
                    mkdir -p dist
                    for abi in armeabi-v7a arm64-v8a x86_64; do
                        apk="app-$abi-release.apk"
                        [[ -f "incoming/$apk" && ! -L "incoming/$apk" ]] || { echo "Missing APK: $apk" >&2; exit 1; }
                        "$apksigner" sign --ks "$RUNNER_TEMP/preview.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "dist/$apk" "incoming/$apk"
                        "$apksigner" verify --verbose "dist/$apk"
                    done
                    cd dist
                    sha256sum *.apk > SHA256SUMS.txt
            -   name: Remove restored signing key
                if: always()
                shell: bash
                run: rm -f "$RUNNER_TEMP/preview.keystore"
            -   name: Upload signed preview APKs
                uses: actions/upload-artifact@v4
                with:
                    name: signed-android-preview-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
                    path: dist/*
                    if-no-files-found: error
                    retention-days: 14
            -   name: Create draft preview release
                shell: bash
                env:
                    GH_TOKEN: ${{ github.token }}
                    GH_REPO: ${{ github.repository }}
                    RUN_ID: ${{ github.event.workflow_run.id }}
                    RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
                    HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                    PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
                    RUN_URL: ${{ github.event.workflow_run.html_url }}
                run: |
                    tag="preview-$RUN_ID-$RUN_ATTEMPT"
                    title="Android Preview $RUN_ID (attempt $RUN_ATTEMPT)"
                    if [[ -n "$PR_NUMBER" ]]; then
                        title="PR #$PR_NUMBER - $title"
                    fi
                    printf 'Preview APKs signed with the same key as Android Release.\n\nCommit: %s\nBuild: %s\n\nChoose the APK matching your device architecture.\n' "$HEAD_SHA" "$RUN_URL" > "$RUNNER_TEMP/preview-notes.md"
                    if gh release view "$tag" > /dev/null 2>&1; then
                        [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]] || { echo 'Preview release is already published; refusing to overwrite.' >&2; exit 1; }
                        gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber
                    else
                        # A fork commit may not exist in the base repository; keep
                        # the exact source SHA in the notes rather than tagging it.
                        gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt --draft --prerelease --title "$title" --notes-file "$RUNNER_TEMP/preview-notes.md"
                    fi

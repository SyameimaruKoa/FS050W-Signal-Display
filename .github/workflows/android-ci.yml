name: Android CI

on:
    pull_request:
        paths:
            -   'android/**'
            -   '!android/.gradle/**'
            -   '!android/build/**'
            -   '!android/**/build/**'
            -   '.github/actions/android-version/**'
            -   '.github/workflows/android-*.yml'
    push:
        branches: [main]
        paths:
            -   'android/**'
            -   '!android/.gradle/**'
            -   '!android/build/**'
            -   '!android/**/build/**'
            -   '.github/actions/android-version/**'
            -   '.github/workflows/android-*.yml'
    workflow_dispatch:
        inputs:
            build_name:
                description: 'Optional APK version name for device testing'
                required: false
                type: string
            build_number:
                description: 'Legacy input: leave empty; versionCode is allocated automatically'
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: android-build-version
    cancel-in-progress: false
    queue: max

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '17'
            -   uses: gradle/actions/setup-gradle@v4
                with:
                    gradle-version: wrapper
            -   uses: ./.github/actions/android-version
                id: version
                with:
                    build_name: ${{ inputs.build_name }}
                    build_number: ${{ inputs.build_number }}
            -   name: Run unit tests
                working-directory: android
                run: ./gradlew testDebugUnitTest --no-daemon
            -   name: Build debug APK
                working-directory: android
                env:
                    BUILD_NAME: ${{ steps.version.outputs.name }}
                    BUILD_NUMBER: ${{ steps.version.outputs.code }}
                run: ./gradlew :app:assembleDebug --no-daemon -PversionName="$BUILD_NAME" -PversionCode="$BUILD_NUMBER"
            -   name: Upload debug APK
                uses: actions/upload-artifact@v4
                with:
                    name: android-debug-${{ github.sha }}
                    path: android/app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
                    retention-days: 14
            -   name: Build release APK
                working-directory: android
                env:
                    BUILD_NAME: ${{ steps.version.outputs.name }}
                    BUILD_NUMBER: ${{ steps.version.outputs.code }}
                run: ./gradlew :app:assembleRelease --no-daemon -PversionName="$BUILD_NAME" -PversionCode="$BUILD_NUMBER"
            -   name: Prepare ABI-named release APKs
                working-directory: android/app/build/outputs/apk/release
                run: |
                    # The native app has no .so files, so a single universal APK is built.
                    # Publish it under the legacy ABI names so the existing preview
                    # workflow (which runs from the default branch) can sign it.
                    for abi in armeabi-v7a arm64-v8a x86_64; do
                        cp app-release.apk "app-$abi-release.apk"
                    done
            -   name: Upload release APK
                uses: actions/upload-artifact@v4
                with:
                    name: android-release-preview-${{ github.sha }}
                    path: android/app/build/outputs/apk/release/*-release.apk
                    if-no-files-found: error
                    retention-days: 14

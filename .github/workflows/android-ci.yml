name: Android CI

on:
    pull_request:
        paths:
            -   'lib/**'
            -   'android/**'
            -   '!android/.gradle/**'
            -   '!android/build/**'
            -   '!android/**/build/**'
            -   'assets/icons/**'
            -   '!assets/icons/readme.txt'
            -   'test/**'
            -   'pubspec.yaml'
            -   'pubspec.lock'
            -   'analysis_options.yaml'
            -   '.github/actions/setup-flutter/**'
            -   '.github/actions/android-version/**'
            -   '.github/workflows/android-*.yml'
    push:
        branches: [main]
        paths:
            -   'lib/**'
            -   'android/**'
            -   '!android/.gradle/**'
            -   '!android/build/**'
            -   '!android/**/build/**'
            -   'assets/icons/**'
            -   '!assets/icons/readme.txt'
            -   'test/**'
            -   'pubspec.yaml'
            -   'pubspec.lock'
            -   'analysis_options.yaml'
            -   '.github/actions/setup-flutter/**'
            -   '.github/actions/android-version/**'
            -   '.github/workflows/android-*.yml'
    workflow_dispatch:
        inputs:
            build_name:
                description: 'Optional APK version name for device testing'
                required: false
                type: string
            build_number:
                description: 'Legacy input: leave empty; versionCode is allocated automatically'
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: android-build-version
    cancel-in-progress: false
    queue: max

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            -   uses: actions/checkout@v4
            -   uses: ./.github/actions/setup-flutter
            -   uses: ./.github/actions/android-version
                id: version
                with:
                    build_name: ${{ inputs.build_name }}
                    build_number: ${{ inputs.build_number }}
            -   name: Run tests
                run: flutter test
            -   name: Build debug APK
                env:
                    BUILD_NAME: ${{ steps.version.outputs.name }}
                    BUILD_NUMBER: ${{ steps.version.outputs.code }}
                    ORG_GRADLE_PROJECT_force-version-code-ignoring-abi: 'true'
                run: |
                    build_args=()
                    if [[ -n "$BUILD_NAME" ]]; then
                        build_args+=(--build-name="$BUILD_NAME")
                    fi
                    if [[ -n "$BUILD_NUMBER" ]]; then
                        [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'build_number must be a positive integer' >&2; exit 1; }
                        build_args+=(--build-number="$BUILD_NUMBER")
                    fi
                    flutter build apk --debug "${build_args[@]}"
            -   name: Upload debug APK
                uses: actions/upload-artifact@v4
                with:
                    name: android-debug-${{ github.sha }}
                    path: build/app/outputs/flutter-apk/app-debug.apk
                    if-no-files-found: error
                    retention-days: 14
            -   name: Build release APKs
                env:
                    BUILD_NAME: ${{ steps.version.outputs.name }}
                    BUILD_NUMBER: ${{ steps.version.outputs.code }}
                    ORG_GRADLE_PROJECT_force-version-code-ignoring-abi: 'true'
                run: |
                    build_args=()
                    if [[ -n "$BUILD_NAME" ]]; then
                        build_args+=(--build-name="$BUILD_NAME")
                    fi
                    if [[ -n "$BUILD_NUMBER" ]]; then
                        [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'build_number must be a positive integer' >&2; exit 1; }
                        build_args+=(--build-number="$BUILD_NUMBER")
                    fi
                    flutter build apk --release --split-per-abi "${build_args[@]}"
            -   name: Upload release APKs
                uses: actions/upload-artifact@v4
                with:
                    name: android-release-preview-${{ github.sha }}
                    path: build/app/outputs/flutter-apk/*-release.apk
                    if-no-files-found: error
                    retention-days: 14
